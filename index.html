<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>QR Transfer</title>
<!--
  QR Transfer - Step 2: Phone receiver
  ====================================
  Scans the QR slideshow from qr_sender.py, rebuilds the file,
  checks the password, and lets you save or copy the result.

  Must be opened from an https:// address (e.g. GitHub Pages),
  because phones only allow the camera and encryption on secure pages.

  It undoes exactly what the sender did, in reverse order:
      scan chunks -> join -> decrypt (AES-GCM) -> decompress -> checksum
-->
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #2a2f3a; --field: #0b0d11;
    --text: #e8eaf0; --muted: #8b93a7;
    --accent: #4ade80; --accent-ink: #06210f;
    --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 21px; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=password], input[type=text] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--field); color: var(--text); font-size: 16px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 8px;
           font-size: 14px; color: var(--muted); }
  button { appearance: none; border: 0; border-radius: 10px; padding: 13px 16px;
           font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .secondary { background: #262b36; color: var(--text); }
  .buttons { display: grid; gap: 8px; margin-top: 10px; }
  .viewer { position: relative; border-radius: 12px; overflow: hidden;
            background: #000; aspect-ratio: 3 / 4; margin-bottom: 10px; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame { position: absolute; inset: 14%; border: 3px solid rgba(255,255,255,.65);
           border-radius: 14px; pointer-events: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16px, 1fr));
          gap: 4px; margin-top: 10px; }
  .cell { aspect-ratio: 1; border-radius: 4px; background: #262b36; transition: background .15s; }
  .cell.got { background: var(--accent); }
  .status { font-size: 15px; min-height: 1.45em; }
  .status.err { color: var(--bad); } .status.ok { color: var(--accent); }
  .status.warn { color: var(--warn); }
  .meta { color: var(--muted); font-size: 14px; word-break: break-all; }
  .meta b { color: var(--text); }
  pre { background: var(--field); border: 1px solid var(--line); border-radius: 10px;
        padding: 10px; max-height: 50vh; overflow: auto; font-size: 12px;
        line-height: 1.4; white-space: pre; margin: 10px 0 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>QR Transfer</h1>
  <p class="sub">Receive a file from the PC sender.</p>

  <div class="card">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label class="check"><input id="showpw" type="checkbox"> Show password</label>
  </div>

  <div class="card" id="scanCard">
    <div class="viewer hidden" id="viewer">
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
    </div>
    <div class="status" id="status">Type the password, then start scanning.</div>
    <div class="grid" id="grid"></div>
    <div class="buttons">
      <button class="primary" id="startBtn">Start scanning</button>
      <button class="secondary hidden" id="stopBtn">Stop camera</button>
      <button class="primary hidden" id="decryptBtn">Decrypt</button>
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="status ok">File received and checked ✓</div>
    <div class="meta" id="meta"></div>
    <pre id="preview" class="hidden"></pre>
    <div class="buttons">
      <button class="primary" id="saveBtn">Save file</button>
      <button class="secondary" id="copyBtn">Copy text</button>
      <button class="secondary" id="againBtn">Receive another</button>
    </div>
  </div>
</main>

<script>
// ==== core (no page elements - shared format with qr_sender.py) ====
const MAGIC = new TextEncoder().encode("QRT1");
const PBKDF2_ITERATIONS = 300000;
const SALT_SIZE = 16;
const NONCE_SIZE = 12;

function base64ToBytes(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function toHex(buffer) {
  return [...new Uint8Array(buffer)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// One QR code looks like:  QRT1|<transfer id>|<chunk number>|<total>|<base64 data>
function parseChunk(text) {
  const p = String(text).split("|");
  if (p.length !== 5 || p[0] !== "QRT1") return null;
  if (!/^[0-9a-f]{4}$/.test(p[1]) || !/^\d+$/.test(p[2]) || !/^\d+$/.test(p[3])) return null;
  const i = Number(p[2]), n = Number(p[3]);
  if (n < 1 || i >= n) return null;
  try { return { id: p[1], i, n, data: base64ToBytes(p[4]) }; }
  catch { return null; }
}

function joinChunks(chunkMap, total) {
  const parts = [];
  for (let i = 0; i < total; i++) parts.push(chunkMap.get(i));
  const size = parts.reduce((s, p) => s + p.length, 0);
  const out = new Uint8Array(size);
  let pos = 0;
  for (const p of parts) { out.set(p, pos); pos += p.length; }
  return out;
}

async function inflate(bytes) {
  // Python's zlib.compress output = "deflate" format in browsers
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unpackBlob(bytes, password) {
  for (let k = 0; k < MAGIC.length; k++) {
    if (bytes[k] !== MAGIC[k]) throw new Error("This isn't a QR Transfer file.");
  }
  const salt  = bytes.slice(4, 4 + SALT_SIZE);
  const nonce = bytes.slice(4 + SALT_SIZE, 4 + SALT_SIZE + NONCE_SIZE);
  const encrypted = bytes.slice(4 + SALT_SIZE + NONCE_SIZE);

  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt, iterations: PBKDF2_ITERATIONS },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

  let plain;
  try {
    plain = new Uint8Array(await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: nonce, additionalData: MAGIC }, key, encrypted));
  } catch {
    throw new Error("Wrong password (or the data was damaged).");
  }

  const headerLen = (plain[0] << 8) | plain[1];
  const header = JSON.parse(new TextDecoder().decode(plain.slice(2, 2 + headerLen)));
  const data = await inflate(plain.slice(2 + headerLen));
  if (toHex(await crypto.subtle.digest("SHA-256", data)) !== header.sha256) {
    throw new Error("Checksum mismatch - the file is damaged.");
  }
  return { name: header.name, data };
}

// Turn bytes into readable text for the preview (handles Windows Notepad formats too)
function decodeText(data) {
  if (data.length >= 2 && data[0] === 0xFF && data[1] === 0xFE) return new TextDecoder("utf-16le").decode(data);
  if (data.length >= 2 && data[0] === 0xFE && data[1] === 0xFF) return new TextDecoder("utf-16be").decode(data);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(data); }
  catch {}
  if (!data.includes(0)) return new TextDecoder("windows-1250").decode(data); // old "ANSI" files
  return null; // not text
}
// ==== end core ====


// ==== page logic ====
const $ = id => document.getElementById(id);
const video = $("video");
let stream = null, detector = null, scanTimer = null, busy = false;
let canvas = null, ctx = null;
let transfer = null;   // { id, total, chunks: Map }
let blob = null;       // all chunks joined
let result = null;     // { name, data, text }

function setStatus(msg, kind = "") {
  const s = $("status");
  s.textContent = msg;
  s.className = "status " + kind;
}
function show(id, yes) { $(id).classList.toggle("hidden", !yes); }

$("showpw").onchange = () => { $("pw").type = $("showpw").checked ? "text" : "password"; };

function buildGrid(n) {
  const g = $("grid");
  g.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "cell";
    g.appendChild(c);
  }
}

function handleText(text) {
  if (blob) return;                       // already finished
  const c = parseChunk(text);
  if (!c) return;                         // not one of our codes

  if (!transfer || transfer.id !== c.id) {
    // A new transfer (e.g. the sender was restarted): start over.
    const restarted = transfer !== null;
    transfer = { id: c.id, total: c.n, chunks: new Map() };
    buildGrid(c.n);
    if (restarted) setStatus("New transfer detected - starting over.", "warn");
  }
  if (c.n !== transfer.total || transfer.chunks.has(c.i)) return;

  transfer.chunks.set(c.i, c.data);
  $("grid").children[c.i].classList.add("got");
  if (navigator.vibrate) navigator.vibrate(15);
  setStatus(`Received ${transfer.chunks.size} of ${transfer.total}`);

  if (transfer.chunks.size === transfer.total) {
    blob = joinChunks(transfer.chunks, transfer.total);
    stopCamera();
    tryDecrypt();
  }
}

function loadJsQR() {
  // Backup QR reader, only loaded if the phone has no built-in one
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    s.onload = resolve;
    s.onerror = () => reject(new Error("Couldn't load the QR reader. Check your internet."));
    document.head.appendChild(s);
  });
}

async function startCamera() {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    setStatus("The camera only works on an https:// page (like GitHub Pages).", "err");
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
  } catch (e) {
    setStatus("Couldn't open the camera: " + e.message, "err");
    return;
  }
  video.srcObject = stream;
  await video.play();

  if (!detector && "BarcodeDetector" in window) {
    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      if (formats.includes("qr_code")) detector = new BarcodeDetector({ formats: ["qr_code"] });
    } catch {}
  }
  if (!detector && !window.jsQR) {
    try { await loadJsQR(); }
    catch (e) { setStatus(e.message, "err"); stopCamera(); return; }
  }

  show("viewer", true); show("startBtn", false); show("stopBtn", true);
  if (!transfer) setStatus("Point the camera at the QR codes on the PC screen.");
  scanTick();
}

async function scanTick() {
  if (!stream) return;
  if (!busy && video.readyState >= 2) {
    busy = true;
    try {
      if (detector) {
        for (const code of await detector.detect(video)) handleText(code.rawValue);
      } else if (window.jsQR) {
        // Read the centre square at full sharpness (QR codes have tiny squares,
        // so shrinking the picture would make them unreadable).
        const vw = video.videoWidth, vh = video.videoHeight;
        const side = Math.min(vw, vh);
        const out = Math.min(side, 1080);
        if (!canvas) { canvas = document.createElement("canvas"); ctx = canvas.getContext("2d", { willReadFrequently: true }); }
        canvas.width = out; canvas.height = out;
        ctx.drawImage(video, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, out, out);
        const found = jsQR(ctx.getImageData(0, 0, out, out).data, out, out, { inversionAttempts: "dontInvert" });
        if (found) handleText(found.data);
      }
    } catch {}
    busy = false;
  }
  scanTimer = setTimeout(scanTick, 60);
}

function stopCamera() {
  clearTimeout(scanTimer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  show("viewer", false); show("stopBtn", false);
  show("startBtn", !blob);
  if (!blob && transfer) setStatus(`Paused at ${transfer.chunks.size} of ${transfer.total}. Start again to continue.`);
}

async function tryDecrypt() {
  const pw = $("pw").value;
  if (!pw) {
    setStatus("All codes received. Type the password, then tap Decrypt.", "warn");
    show("decryptBtn", true);
    return;
  }
  setStatus("Decrypting...");
  show("decryptBtn", false);
  try {
    const r = await unpackBlob(blob, pw);
    result = { ...r, text: decodeText(r.data) };
    showResult();
  } catch (e) {
    setStatus(e.message + " Fix the password and tap Decrypt.", "err");
    $("decryptBtn").textContent = "Decrypt again";
    show("decryptBtn", true);
  }
}

function showResult() {
  show("scanCard", false);
  show("resultCard", true);
  const kb = (result.data.length / 1024).toFixed(1);
  const lines = result.text === null ? "" : ` · ${result.text.split("\n").length} lines`;
  $("meta").innerHTML = "";
  const b = document.createElement("b");
  b.textContent = result.name;
  $("meta").append(b, ` · ${kb} KB${lines}`);

  if (result.text !== null) {
    $("preview").textContent = result.text.length > 200000
      ? result.text.slice(0, 200000) + "\n\n... (preview cut short - the saved file is complete)"
      : result.text;
    show("preview", true);
    show("copyBtn", true);
  } else {
    show("preview", false);
    show("copyBtn", false);
  }
}

$("startBtn").onclick = startCamera;
$("stopBtn").onclick = stopCamera;
$("decryptBtn").onclick = tryDecrypt;

$("saveBtn").onclick = () => {
  const safeName = (result.name || "received.txt").replace(/[\\/:*?"<>|]/g, "_");
  const url = URL.createObjectURL(new Blob([result.data], { type: "application/octet-stream" }));
  const a = document.createElement("a");
  a.href = url; a.download = safeName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
};

$("copyBtn").onclick = async () => {
  try {
    await navigator.clipboard.writeText(result.text);
    $("copyBtn").textContent = "Copied ✓";
  } catch {
    $("copyBtn").textContent = "Couldn't copy";
  }
  setTimeout(() => { $("copyBtn").textContent = "Copy text"; }, 1500);
};

$("againBtn").onclick = () => {
  transfer = null; blob = null; result = null;
  $("grid").innerHTML = "";
  $("decryptBtn").textContent = "Decrypt";
  show("resultCard", false); show("scanCard", true);
  show("decryptBtn", false); show("startBtn", true);
  setStatus("Type the password, then start scanning.");
};
</script>
</body>
</html>
